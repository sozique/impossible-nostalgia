name: Build legacy Android APK (Android 7)

on:
  workflow_dispatch:

jobs:
  android_legacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Change only the runner's temporary checkout. The Android 8+ project
      # and its existing Honor workflow remain untouched in GitHub.
      - name: Prepare independent Android 7 variant
        working-directory: impossible_nostalgia_android_build_project
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc 'minSdk 26' app/build.gradle)" -eq 1
          test "$(grep -Fc "applicationId 'com.annasoz.impossiblenostalgia'" app/build.gradle)" -eq 1
          sed -i 's/minSdk 26/minSdk 24/' app/build.gradle
          sed -i "s/applicationId 'com.annasoz.impossiblenostalgia'/applicationId 'com.annasoz.impossiblenostalgia.legacy'/" app/build.gradle
          sed -i "s/versionName '1.0-test'/versionName '1.0-legacy-android7'/" app/build.gradle
          grep -F 'minSdk 24' app/build.gradle
          grep -F "applicationId 'com.annasoz.impossiblenostalgia.legacy'" app/build.gradle

      - name: Build Android 7-compatible debug APK
        working-directory: impossible_nostalgia_android_build_project
        run: gradle :app:assembleDebug --no-daemon

      - name: Give the APK a distinct name
        shell: bash
        run: |
          mkdir -p legacy-apk
          cp impossible_nostalgia_android_build_project/app/build/outputs/apk/debug/app-debug.apk legacy-apk/impossible-nostalgia-legacy-android7.apk

      - uses: actions/upload-artifact@v4
        with:
          name: impossible-nostalgia-legacy-android7
          path: legacy-apk/impossible-nostalgia-legacy-android7.apk
          if-no-files-found: error
