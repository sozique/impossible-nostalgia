plugins { id 'com.android.application' }

android {
    namespace 'com.annasoz.impossiblenostalgia'
    compileSdk 35
    defaultConfig {
        applicationId 'com.annasoz.impossiblenostalgia'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0-test'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
